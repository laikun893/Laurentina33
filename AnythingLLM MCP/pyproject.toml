[project]
name = "anythingllm-mcp"
version = "0.1.0"
description = "MCP server exposing a local AnythingLLM instance"
requires-python = ">=3.10"
dependencies = ["mcp>=2.2.0", "httpx2>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
anythingllm-mcp = "anythingllm_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anythingllm_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
