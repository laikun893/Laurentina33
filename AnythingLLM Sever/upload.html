<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AnythingLLM 文档上传</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  #log { white-space: pre-wrap; background: #f5f5f5; padding: 12px; margin-top: 16px;
         border-radius: 6px; min-height: 60px; font-size: 13px; }
  .ok { color: #0a7d2c; } .err { color: #c00; }
</style>
</head>
<body>
<h2>上传文档到工作区「text」并向量化</h2>
<input type="file" id="file">
<button id="btn">上传并向量化</button>
<div id="log">等待上传…</div>

<script>
const API = "http://localhost:3001/api/v1/document/upload";
const KEY = "5C047SP-FMBMN3F-MJTYNAQ-W1EK4X1";
const WORKSPACE = "text";
const log = (msg, cls) => {
  const el = document.getElementById("log");
  el.className = cls || "";
  el.textContent = msg;
};

document.getElementById("btn").onclick = async () => {
  const file = document.getElementById("file").files[0];
  if (!file) return log("请先选择一个文件", "err");

  const fd = new FormData();
  fd.append("file", file);
  fd.append("addToWorkspaces", WORKSPACE);

  log("上传中：" + file.name + " …");
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { Authorization: "Bearer " + KEY },
      body: fd
    });
    const data = await res.json();
    if (res.ok && data.success) {
      log("上传成功并已加入工作区「" + WORKSPACE + "」\n\n" + JSON.stringify(data, null, 2), "ok");
    } else {
      log("失败 (" + res.status + ")\n\n" + JSON.stringify(data, null, 2), "err");
    }
  } catch (e) {
    log("请求错误：" + e.message, "err");
  }
};
</script>
</body>
</html>
